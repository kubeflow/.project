# Maintainer roster for Kubeflow
# Documentation: https://github.com/cncf/automation/tree/main/utilities/dot-project


#  Maintainers: Please connect your GitHub handle to your LFID on openprofile.dev to enable automatic access to CNCF resources. The system will use your primary email address for setup.
maintainers:
  - project_id: "kubeflow"
    org: "kubeflow"
    teams:
      # Roster = KSC member, Outreach committee Chair, Community Distribution maintainer,
      # appointed chairs of the Kubeflow Working Groups, and
      # root approver of the Kubeflow Subprojects' code repositories.
      #
      # Trailing comments record the role each member holds, most significant first:
      #   KSC / KOC / KDC        -> Kubeflow Steering commitee member / Outreach Chair / Community Distribution maintainer
      #   chair: <wg>            -> appointed chair of a Kubeflow Working Group
      #   approver: <subproject> -> root approver in that subproject's OWNERS file
      #
      # Source of truth: https://github.com/kubeflow/community
